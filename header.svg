<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hey, I'm Emanuel. C++ software engineer building compilers, network servers and embedded firmware on Linux.</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="fade" cx="30%" cy="45%" r="80%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask"><rect width="960" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".75" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="card"><rect width="960" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .orb1 { animation: drift1 16s ease-in-out infinite alternate; }
    .orb2 { animation: drift2 20s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(120px, 50px); } }
    @keyframes drift2 { to { transform: translate(-150px, -40px); } }
    .line { opacity: 0; animation: cycle 12s infinite; }
    .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      4%, 30% { opacity: 1; transform: translateY(0); }
      34%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .float { animation: float 6s ease-in-out infinite alternate; }
    @keyframes float { to { transform: translateY(-8px); } }
    .rise { animation: rise .9s ease-out both; }
    .r2 { animation-delay: .15s; } .r3 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="960" height="320" fill="#0b0f17"/>
    <circle class="orb1" cx="170" cy="70" r="150" fill="#3b82f6" opacity=".16" filter="url(#blur)"/>
    <circle class="orb2" cx="830" cy="270" r="170" fill="#00599c" opacity=".30" filter="url(#blur)"/>
    <rect width="960" height="320" fill="url(#dots)" mask="url(#dotMask)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="319" rx="20" fill="none" stroke="url(#border)"/>

  <g class="rise">
    <rect x="48" y="40" width="250" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <circle class="dot" cx="66" cy="56" r="4" fill="#22c55e"/>
    <text x="80" y="61" class="mono" font-size="13" fill="#cbd5e1">open to work · Israel</text>
  </g>

  <g class="rise r2">
    <text x="46" y="150" class="sans" font-size="60" font-weight="700" letter-spacing="-2" fill="url(#name)">Hey, I'm Emanuel.</text>
    <text x="48" y="186" class="sans" font-size="20" fill="#94a3b8">C++ Software Engineer · Linux · Backend</text>
  </g>

  <g class="rise r3 mono" font-size="19">
    <text x="48" y="248" fill="#64748b">~</text>
    <text x="66" y="248" fill="#60a5fa">$</text>
    <g fill="#f1f5f9">
      <text class="line" x="88" y="248">writing a compiler that emits x86-64<tspan class="cursor" fill="#60a5fa"> ▌</tspan></text>
      <text class="line l2" x="88" y="248">serving clients on a poll() event loop<tspan class="cursor" fill="#60a5fa"> ▌</tspan></text>
      <text class="line l3" x="88" y="248">flashing firmware onto an ESP32<tspan class="cursor" fill="#60a5fa"> ▌</tspan></text>
    </g>
  </g>

  <g class="rise r3"><g class="float">
    <rect x="652" y="52" width="260" height="176" rx="14" fill="#111827" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="674" cy="74" r="5" fill="#ff5f57"/><circle cx="692" cy="74" r="5" fill="#febc2e"/><circle cx="710" cy="74" r="5" fill="#28c840"/>
    <text x="892" y="78" text-anchor="end" class="mono" font-size="11" fill="#64748b">~/projects</text>
    <line x1="652" y1="92" x2="912" y2="92" stroke="#ffffff" stroke-opacity=".08"/>
    <g class="mono" font-size="14" fill="#e2e8f0">
      <circle cx="676" cy="116" r="4" fill="#60a5fa"/><text x="692" y="121">compiler</text><text x="892" y="121" text-anchor="end" fill="#64748b">C++20</text>
      <circle cx="676" cy="144" r="4" fill="#60a5fa"/><text x="692" y="149">redis</text><text x="892" y="149" text-anchor="end" fill="#64748b">C++17</text>
      <circle cx="676" cy="172" r="4" fill="#60a5fa"/><text x="692" y="177">site</text><text x="892" y="177" text-anchor="end" fill="#64748b">Beast</text>
      <circle cx="676" cy="200" r="4" fill="#22c55e"/><text x="692" y="205">safeher</text><text x="892" y="205" text-anchor="end" fill="#64748b">ESP32</text>
    </g>
  </g></g>
</svg>
